[Launch]
ProgramExecutable=VideoCodecScanner\VideoCodecScanner.exe
WorkingDirectory=%PAL:AppDir%\VideoCodecScanner
CommandLineArguments=
CleanTemp=true
SinglePortableAppInstance=true
SingleAppInstance=true
WaitForProgram=true
WaitForOtherInstances=false
DirectoryMoveOK=yes
SupportsUNC=yes
SplashTime=1500

[Environment]
VIDEO_CODEC_SCANNER_PORTABLE=1
VIDEO_CODEC_SCANNER_DATA=%PAL:DataDir%
